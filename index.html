<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FleetCore - Portal Authentication</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet"/>
  
  <!-- Bootstrap Icons Standard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B2545',
              blue: '#134074',
              teal: '#00A896',
              mint: '#02C39A',
              subtle: '#EEF4F8'
            },
            primary: "#004ac6",
            "border-light": "#E2E8F0"
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Manrope', sans-serif; }
    
    /* Full-Cover Backdrop Photo with Contrast Gradient */
    .fc-photo-bg {
      background: linear-gradient(rgba(11, 37, 69, 0.78), rgba(15, 23, 42, 0.88)),
                  url('https://images.unsplash.com/photo-1772440223098-cc23f6f01209?q=80&w=1200&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
    }

    /* Glass Container */
    .fc-auth-card {
      background: rgba(11, 37, 69, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    /* High-contrast Input Styling overriding Tailwind Form Defaults */
    .fc-input-field {
      background-color: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important;
      transition: all 0.2s ease;
    }
    .fc-input-field:focus {
      background-color: rgba(255, 255, 255, 0.14) !important;
      border-color: #00A896 !important;
      box-shadow: 0 0 0 2px rgba(0, 168, 150, 0.35) !important;
      outline: none !important;
    }
    .fc-input-field::placeholder {
      color: rgba(255, 255, 255, 0.45) !important;
    }

    /* Prevent browser autofill from turning inputs opaque white */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0e294b inset !important;
      -webkit-text-fill-color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body class="fc-photo-bg min-h-screen flex flex-col justify-center items-center p-4 antialiased">

  <div class="w-full max-w-md my-auto relative z-10">

    <!-- Logo Badge -->
    <div class="flex justify-center items-center gap-2 mb-4 bg-white px-4 py-2 rounded-2xl w-fit mx-auto shadow-xl">
      <img alt="FleetCore Logo" class="h-6 w-auto object-contain" src="assets/images/logo.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 40 40\'%3E%3Crect width=\'40\' height=\'40\' rx=\'8\' fill=\'%230B2545\'/%3E%3Ctext x=\'20\' y=\'25\' font-size=\'14\' font-weight=\'bold\' fill=\'%2300A896\' text-anchor=\'middle\'%3EFC%3C/text%3E%3C/svg%3E'"/>
      <span class="font-display text-sm font-black tracking-tight">
        <span class="text-brand-navy">FLEET</span><span class="text-teal-600">CORE</span>
      </span>
    </div>

    <!-- Main Card Container -->
    <div class="fc-auth-card rounded-3xl p-6 sm:p-8">
      
      <!-- Mode Switcher (Log In / Register) -->
      <div class="flex p-1 bg-black/30 rounded-xl mb-5 max-w-[210px] mx-auto text-xs font-bold border border-white/10">
        <button class="flex-1 py-1.5 rounded-lg text-white transition-all duration-200 bg-teal-600 shadow-md" id="btn-mode-login" onclick="setAuthMode('login')" type="button">Log In</button>
        <button class="flex-1 py-1.5 rounded-lg text-white/60 hover:text-white transition-all duration-200" id="btn-mode-signup" onclick="setAuthMode('signup')" type="button">Register</button>
      </div>

      <div class="text-center mb-4">
        <h1 class="font-display text-xl sm:text-2xl font-black text-white tracking-tight" id="auth-title">Welcome back</h1>
        <p class="text-xs text-white/60 mt-0.5" id="auth-subtitle">Smart. Connected. Managed.</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="grid grid-cols-4 gap-1 p-1 bg-black/30 rounded-xl mb-2 text-center text-[11px] font-bold border border-white/10" id="fc-role-tabs">
        <button class="py-1.5 rounded-lg text-white bg-white/20 transition fc-tab-btn shadow-sm" data-role="company_admin" type="button">Admin</button>
        <button class="py-1.5 rounded-lg text-white/60 hover:text-white transition fc-tab-btn" data-role="driver" type="button">Driver</button>
        <button class="py-1.5 rounded-lg text-white/60 hover:text-white transition fc-tab-btn" data-role="maintenance_officer" type="button">Service</button>
        <button class="py-1.5 rounded-lg text-white/60 hover:text-white transition fc-tab-btn" data-role="account_manager" type="button">Finance</button>
      </div>
      <p class="text-center text-[11px] text-teal-300 mb-4 h-4 font-semibold transition-all" id="fc-role-hint">Full fleet visibility and live operations.</p>

      <!-- Error / Alert Box -->
      <div class="hidden mb-3.5 p-3 rounded-xl border text-xs flex items-center gap-2.5 transition" id="auth-alert">
        <i class="bi bi-exclamation-circle-fill text-sm" id="auth-alert-icon"></i>
        <span id="auth-alert-msg"></span>
      </div>

      <!-- Unified Form -->
      <form class="flex flex-col gap-3.5" id="auth-form" onsubmit="handleAuthSubmit(event)">
        
        <!-- Registration Fields -->
        <div class="hidden space-y-3" id="signup-fields">
          <div>
            <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider mb-1">Full Name</label>
            <div class="relative flex items-center">
              <i class="bi bi-person text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
              <input autocomplete="name" id="full_name" name="full_name" placeholder="John Doe" type="text" class="fc-input-field w-full pl-10 pr-3.5 py-2.5 rounded-xl text-xs font-semibold relative z-10"/>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider mb-1">Company Name</label>
              <div class="relative flex items-center">
                <i class="bi bi-building text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
                <input autocomplete="organization" id="company_name" name="company_name" placeholder="TransCore Ltd" type="text" class="fc-input-field w-full pl-10 pr-3.5 py-2.5 rounded-xl text-xs font-semibold relative z-10"/>
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider mb-1">Company Code <span class="text-teal-400">*</span></label>
              <div class="relative flex items-center">
                <i class="bi bi-hash text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
                <input autocomplete="off" id="company_code" name="company_code" placeholder="TC-001" type="text" class="fc-input-field w-full pl-10 pr-3.5 py-2.5 rounded-xl text-xs font-mono font-bold uppercase relative z-10"/>
              </div>
            </div>
          </div>
        </div>

        <!-- Email Field -->
        <div>
          <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider mb-1" id="email-label">Email Address</label>
          <div class="relative flex items-center">
            <i class="bi bi-envelope text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
            <input autocomplete="email" id="email" name="email" placeholder="you@company.com" required type="email" class="fc-input-field w-full pl-10 pr-3.5 py-2.5 rounded-xl text-xs font-semibold relative z-10"/>
          </div>
        </div>

        <!-- Password Field with Contrast Visibility Toggle -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider">Password</label>
            <a class="text-[11px] font-bold text-teal-300 hover:text-teal-200 transition" href="forgot-password.html" id="forgot-link">Forgot?</a>
          </div>
          <div class="relative flex items-center">
            <i class="bi bi-key text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
            <input autocomplete="current-password" class="fc-input-field w-full pl-10 pr-10 py-2.5 rounded-xl text-xs font-semibold relative z-10" id="password" name="password" placeholder="••••••••" required type="password"/>
            <button type="button" onclick="togglePasswordVisibility('password', 'password-toggle-icon')" class="absolute right-3.5 z-20 text-white/70 hover:text-white p-1 rounded-lg focus:outline-none transition">
              <i class="bi bi-eye text-base" id="password-toggle-icon"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between text-[11.5px] text-white/70 pt-0.5" id="remember-row">
          <label class="flex items-center gap-2 cursor-pointer font-medium select-none">
            <input class="rounded border-white/30 bg-white/10 text-teal-500 focus:ring-0 w-4 h-4 cursor-pointer" id="remember" type="checkbox"/> Remember me
          </label>
        </div>

        <!-- Submit Button -->
        <button class="w-full py-3.5 mt-1 bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-700 hover:to-teal-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-teal-600/30 active:scale-95 transition flex items-center justify-center gap-2" id="submit-btn" type="submit">
          <span id="submit-btn-text">Sign In</span>
        </button>
      </form>
    </div>

    <!-- Restricted Portal Footer Link -->
    <div class="text-center mt-5">
      <a class="inline-flex items-center gap-1.5 text-[11px] text-white/50 hover:text-white uppercase font-bold tracking-widest transition" href="bex-admin/dashboard.html" title="Platform Admin">
        <i class="bi bi-lock-fill text-xs"></i> <span>Restricted Platform Console</span>
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/auth.js"></script>

  <script>
    let currentMode = 'login';
    let currentRole = 'company_admin';

    const ROLE_HINTS = {
      company_admin: "Full fleet visibility and live operations.",
      driver: "In-cab console — today's trips, GPS radar, and SOS.",
      maintenance_officer: "Vehicle health diagnostics and work orders.",
      account_manager: "Fuel expenses, invoices, and fleet audit reports.",
    };

    const ROLE_LABELS = {
      company_admin: "Admin",
      driver: "Driver",
      maintenance_officer: "Service",
      account_manager: "Finance",
      bex_admin: "Platform Root"
    };

    const ROLE_ROUTES = {
      company_admin: 'admin/dashboard.html',
      driver: 'driver/dashboard.html',
      maintenance_officer: 'maintenance/dashboard.html',
      account_manager: 'finance/dashboard.html'
    };

    const tabs = document.querySelectorAll('.fc-tab-btn');
    const hint = document.getElementById('fc-role-hint');

    function selectTab(btn) {
      tabs.forEach(t => {
        t.className = "py-1.5 rounded-lg text-white/60 hover:text-white transition fc-tab-btn";
      });
      btn.className = "py-1.5 rounded-lg text-white bg-white/20 transition fc-tab-btn shadow-sm";
      currentRole = btn.dataset.role;
      hint.textContent = ROLE_HINTS[currentRole];
    }

    tabs.forEach(btn => btn.addEventListener('click', () => selectTab(btn)));

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash text-base';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye text-base';
      }
    }

    function setAuthMode(mode) {
      currentMode = mode;
      const loginBtn = document.getElementById('btn-mode-login');
      const signupBtn = document.getElementById('btn-mode-signup');
      const signupFields = document.getElementById('signup-fields');
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');
      const submitText = document.getElementById('submit-btn-text');
      const forgotLink = document.getElementById('forgot-link');
      const rememberRow = document.getElementById('remember-row');
      const alertBox = document.getElementById('auth-alert');
      alertBox.classList.add('hidden');

      if (mode === 'signup') {
        loginBtn.className = "flex-1 py-1.5 rounded-lg text-white/60 hover:text-white transition-all duration-200";
        signupBtn.className = "flex-1 py-1.5 rounded-lg text-white bg-teal-600 shadow-md transition-all duration-200";
        signupFields.classList.remove('hidden');
        title.textContent = "Create Account";
        subtitle.textContent = "Join FleetCore to manage your operations.";
        submitText.textContent = "Register & Continue";
        forgotLink.classList.add('hidden');
        rememberRow.classList.add('hidden');
      } else {
        signupBtn.className = "flex-1 py-1.5 rounded-lg text-white/60 hover:text-white transition-all duration-200";
        loginBtn.className = "flex-1 py-1.5 rounded-lg text-white bg-teal-600 shadow-md transition-all duration-200";
        signupFields.classList.add('hidden');
        title.textContent = "Welcome back";
        subtitle.textContent = "Smart. Connected. Managed.";
        submitText.textContent = "Sign In";
        forgotLink.classList.remove('hidden');
        rememberRow.classList.remove('hidden');
      }
    }

    function showAlert(message, isSuccess = false) {
      const alertBox = document.getElementById('auth-alert');
      const alertMsg = document.getElementById('auth-alert-msg');
      const alertIcon = document.getElementById('auth-alert-icon');
      
      alertMsg.textContent = message;
      if (isSuccess) {
        alertBox.className = "mb-3.5 p-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs flex items-center gap-2.5";
        alertIcon.className = "bi bi-check-circle-fill text-sm text-emerald-400 shrink-0";
      } else {
        alertBox.className = "mb-3.5 p-3 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2.5";
        alertIcon.className = "bi bi-exclamation-triangle-fill text-sm text-rose-400 shrink-0";
      }
      alertBox.classList.remove('hidden');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('submit-btn-text');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('full_name')?.value?.trim();
      const companyName = document.getElementById('company_name')?.value?.trim();
      const companyCode = document.getElementById('company_code')?.value?.trim().toUpperCase();

      if (currentMode === 'signup' && !companyCode) {
        showAlert('Company Code is required for registration.');
        return;
      }

      btn.disabled = true;
      btnText.textContent = currentMode === 'login' ? 'Authenticating...' : 'Registering...';

      try {
        const client = window.supabaseClient || window.supabase;
        if (!client) throw new Error('Connecting to Supabase... Please try again.');

        if (currentMode === 'login') {
          // Suppress automatic listener redirect while checking the profile role
          window.fcIsExplicitLogin = true;

          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;

          // Fetch verified role directly from public.profiles
          const { data: profile, error: profileErr } = await client
            .from('profiles')
            .select('role')
            .eq('id', data.user.id)
            .single();

          const actualRole = profile?.role || data.user.user_metadata?.role;

          // Strict Role Validation Check
          if (actualRole !== currentRole) {
            await client.auth.signOut();
            window.fcIsExplicitLogin = false;

            const expectedTab = ROLE_LABELS[actualRole] || actualRole;
            const chosenTab = ROLE_LABELS[currentRole] || currentRole;

            showAlert(`This account is registered as ${expectedTab}, not ${chosenTab}. Please select the ${expectedTab} tab to sign in.`);
            btn.disabled = false;
            btnText.textContent = 'Sign In';
            return;
          }

          if (document.getElementById('remember')?.checked) {
            localStorage.setItem('fc_remember_email', email);
          }

          window.location.href = ROLE_ROUTES[actualRole];
        } else {
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName,
                company_name: companyName,
                company_code: companyCode,
                role: currentRole
              }
            }
          });
          if (error) throw error;

          if (data?.user && !data?.session) {
            showAlert("Account registered! Please check your email to confirm your account.", true);
            btn.disabled = false;
            btnText.textContent = "Register & Continue";
            return;
          }
          
          window.location.href = ROLE_ROUTES[currentRole];
        }
      } catch (err) {
        showAlert(err.message || 'Authentication failed. Please check your credentials.');
        btn.disabled = false;
        btnText.textContent = currentMode === 'login' ? 'Sign In' : 'Register & Continue';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const remembered = localStorage.getItem('fc_remember_email');
      if (remembered) {
        const emailInput = document.getElementById('email');
        const rememberBox = document.getElementById('remember');
        if (emailInput) emailInput.value = remembered;
        if (rememberBox) rememberBox.checked = true;
      }
    });
  </script>
</body>
</html>
