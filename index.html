<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FleetCore - Multi-Tenant Portal Authentication</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet"/>
  
  <!-- Bootstrap Icons Standard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B2545',
              blue: '#134074',
              teal: '#00A896',
              mint: '#02C39A',
              subtle: '#EEF4F8'
            },
            primary: "#004ac6",
            "border-light": "#E2E8F0"
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Manrope', sans-serif; }
    
    /* Full-Cover Backdrop Photo with Contrast Gradient */
    .fc-photo-bg {
      background: linear-gradient(rgba(11, 37, 69, 0.78), rgba(15, 23, 42, 0.88)),
                  url('https://images.unsplash.com/photo-1772440223098-cc23f6f01209?q=80&w=1200&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
    }

    /* Glass Container */
    .fc-auth-card {
      background: rgba(11, 37, 69, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    /* High-contrast Input Styling */
    .fc-input-field {
      background-color: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important;
      transition: all 0.2s ease;
    }
    .fc-input-field:focus {
      background-color: rgba(255, 255, 255, 0.14) !important;
      border-color: #00A896 !important;
      box-shadow: 0 0 0 2px rgba(0, 168, 150, 0.35) !important;
      outline: none !important;
    }
    .fc-input-field::placeholder {
      color: rgba(255, 255, 255, 0.45) !important;
    }

    /* Prevent browser autofill from turning inputs opaque white */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0e294b inset !important;
      -webkit-text-fill-color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body class="fc-photo-bg min-h-screen flex flex-col justify-center items-center p-4 antialiased">

  <div class="w-full max-w-md my-auto relative z-10">

    <!-- Logo Badge -->
    <div class="flex justify-center items-center gap-2 mb-4 bg-white px-4 py-2 rounded-2xl w-fit mx-auto shadow-xl">
      <img alt="FleetCore Logo" class="h-6 w-auto object-contain" src="assets/images/logo.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 40 40\'%3E%3Crect width=\'40\' height=\'40\' rx=\'8\' fill=\'%230B2545\'/%3E%3Ctext x=\'20\' y=\'25\' font-size=\'14\' font-weight=\'bold\' fill=\'%2300A896\' text-anchor=\'middle\'%3EFC%3C/text%3E%3C/svg%3E'"/>
      <span class="font-display text-sm font-black tracking-tight">
        <span class="text-brand-navy">FLEET</span><span class="text-teal-600">CORE</span>
      </span>
    </div>

    <!-- Main Card Container -->
    <div class="fc-auth-card rounded-3xl p-6 sm:p-8">
      
      <div class="text-center mb-6">
        <h1 class="font-display text-xl sm:text-2xl font-black text-white tracking-tight">Sign in to Workspace</h1>
        <p class="text-xs text-white/60 mt-1">Enter your organization code and credentials to continue.</p>
      </div>

      <!-- Error / Alert Box -->
      <div class="hidden mb-4 p-3 rounded-xl border text-xs flex items-center gap-2.5 transition" id="auth-alert">
        <i class="bi bi-exclamation-circle-fill text-sm shrink-0" id="auth-alert-icon"></i>
        <span id="auth-alert-msg"></span>
      </div>

      <!-- Unified Form (Auto-Routing) -->
      <form class="flex flex-col gap-3.5" id="auth-form" onsubmit="handleAuthSubmit(event)">
        
        <!-- Organization Tenant Code -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider">
              Organization Code <span class="text-teal-400">*</span>
            </label>
            <span class="text-[10px] text-white/40">e.g. TCL</span>
          </div>
          <div class="relative flex items-center">
            <i class="bi bi-buildings text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
            <input 
              id="org_code" 
              name="org_code" 
              type="text" 
              maxlength="6"
              placeholder="TCL" 
              class="fc-input-field w-full pl-10 pr-3.5 py-2.5 rounded-xl text-xs font-mono font-bold uppercase tracking-widest relative z-10"
              autocomplete="off"
            />
          </div>
          <span class="text-[10px] text-white/40 mt-1 block">Platform Super Admins can leave blank or use BEX.</span>
        </div>

        <!-- Work Email -->
        <div>
          <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider mb-1">Email Address</label>
          <div class="relative flex items-center">
            <i class="bi bi-envelope text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
            <input 
              autocomplete="email" 
              id="email" 
              name="email" 
              placeholder="you@company.com" 
              required 
              type="email" 
              class="fc-input-field w-full pl-10 pr-3.5 py-2.5 rounded-xl text-xs font-semibold relative z-10"
            />
          </div>
        </div>

        <!-- Password Field with Toggle -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-white/80 uppercase tracking-wider">Password</label>
            <a class="text-[11px] font-bold text-teal-300 hover:text-teal-200 transition" href="forgot-password.html">Forgot?</a>
          </div>
          <div class="relative flex items-center">
            <i class="bi bi-key text-white/70 absolute left-3.5 z-20 text-sm pointer-events-none"></i>
            <input 
              autocomplete="current-password" 
              class="fc-input-field w-full pl-10 pr-10 py-2.5 rounded-xl text-xs font-semibold relative z-10" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required 
              type="password"
            />
            <button type="button" onclick="togglePasswordVisibility('password', 'password-toggle-icon')" class="absolute right-3.5 z-20 text-white/70 hover:text-white p-1 rounded-lg focus:outline-none transition">
              <i class="bi bi-eye text-base" id="password-toggle-icon"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between text-[11.5px] text-white/70 pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer font-medium select-none">
            <input class="rounded border-white/30 bg-white/10 text-teal-500 focus:ring-0 w-4 h-4 cursor-pointer" id="remember" type="checkbox"/> Remember me
          </label>
        </div>

        <!-- Submit Button -->
        <button class="w-full py-3.5 mt-2 bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-700 hover:to-teal-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-teal-600/30 active:scale-95 transition flex items-center justify-center gap-2" id="submit-btn" type="submit">
          <span id="submit-btn-text">Sign In to Fleet</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- Platform Super Admin Help Link -->
    <div class="text-center mt-5">
      <span class="text-[11px] text-white/40">
        Need a tenant workspace? Contact your system administrator or Bex Support.
      </span>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/auth.js"></script>

  <script type="module">
    import { authenticateTenantUser } from './js/auth.js';

    // Auto-uppercase tenant code as user types
    const orgCodeInput = document.getElementById('org_code');
    if (orgCodeInput) {
      orgCodeInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.toUpperCase();
      });
    }

    window.togglePasswordVisibility = function(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash text-base';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye text-base';
      }
    };

    function showAlert(message, isSuccess = false) {
      const alertBox = document.getElementById('auth-alert');
      const alertMsg = document.getElementById('auth-alert-msg');
      const alertIcon = document.getElementById('auth-alert-icon');
      
      alertMsg.textContent = message;
      if (isSuccess) {
        alertBox.className = "mb-4 p-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs flex items-center gap-2.5";
        alertIcon.className = "bi bi-check-circle-fill text-sm text-emerald-400 shrink-0";
      } else {
        alertBox.className = "mb-4 p-3 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2.5";
        alertIcon.className = "bi bi-exclamation-triangle-fill text-sm text-rose-400 shrink-0";
      }
      alertBox.classList.remove('hidden');
    }

    window.handleAuthSubmit = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('submit-btn-text');
      const orgCode = document.getElementById('org_code').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('auth-alert');

      alertBox.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Verifying Workspace...';

      try {
        window.fcIsExplicitLogin = true;

        if (document.getElementById('remember')?.checked) {
          localStorage.setItem('fc_remember_email', email);
          if (orgCode) localStorage.setItem('fc_remember_org_code', orgCode);
        } else {
          localStorage.removeItem('fc_remember_email');
          localStorage.removeItem('fc_remember_org_code');
        }

        await authenticateTenantUser(orgCode, email, password);
      } catch (err) {
        window.fcIsExplicitLogin = false;
        showAlert(err.message || 'Authentication failed. Please check your credentials.');
        btn.disabled = false;
        btnText.textContent = 'Sign In to Fleet';
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const rememberedEmail = localStorage.getItem('fc_remember_email');
      const rememberedOrgCode = localStorage.getItem('fc_remember_org_code');
      const emailInput = document.getElementById('email');
      const orgCodeInput = document.getElementById('org_code');
      const rememberBox = document.getElementById('remember');

      if (rememberedEmail && emailInput) {
        emailInput.value = rememberedEmail;
        if (rememberBox) rememberBox.checked = true;
      }
      if (rememberedOrgCode && orgCodeInput) {
        orgCodeInput.value = rememberedOrgCode;
      }
    });
  </script>
</body>
</html>
